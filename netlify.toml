# Deploy en Netlify: sitio estático generado por Vite
[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Cache largo para los assets con hash; el HTML siempre fresco
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
